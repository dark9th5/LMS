name: lmspilot

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile.bundle

x-service-common: &service-common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks: [lmspilot]
  environment: &service-env
    SPRING_PROFILES_ACTIVE: docker
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-4}
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-1}
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT_MS:-3000}
    SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: ${DB_VALIDATION_TIMEOUT_MS:-1000}
    SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT_MS:-60000}
    SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${DB_MAX_LIFETIME_MS:-600000}
    SPRING_JPA_OPEN_IN_VIEW: "false"
    SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: ${HIBERNATE_BATCH_SIZE:-50}
    SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS: "true"
    SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES: "true"
    SERVER_COMPRESSION_ENABLED: "true"
    SERVER_HTTP2_ENABLED: "true"
    SERVER_COMPRESSION_MIN_RESPONSE_SIZE: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:-1024}
    SPRING_THREADS_VIRTUAL_ENABLED: ${SPRING_THREADS_VIRTUAL_ENABLED:-true}
    SPRING_JMX_ENABLED: "false"
    JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=68 -XX:InitialRAMPercentage=10 -XX:+UseG1GC -XX:MaxGCPauseMillis=180 -Djava.security.egd=file:/dev/./urandom}
    LMSPILOT_JWT_SECRET: ${LMSPILOT_JWT_SECRET}
    LMSPILOT_INTERNAL_TOKEN: ${LMSPILOT_INTERNAL_TOKEN}
    IDENTITY_SERVICE_URL: http://identity-service:8081
    LICENSE_SERVICE_URL: http://license-service:8090
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: 5672
    SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
    SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || curl -fsS http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 180s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=160", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=512MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "checkpoint_completion_target=0.9", "-c", "random_page_cost=1.1"]
    networks: [lmspilot]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lmspilot}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_SERVICE_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-lmspilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    networks: [lmspilot]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    profiles: [redis]
    image: redis:8-alpine
    restart: unless-stopped
    networks: [lmspilot]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks: [lmspilot]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api-gateway:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["api-gateway"]
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      IDENTITY_URL: http://identity-service:8081
      ORGANIZATION_URL: http://organization-service:8082
      COURSE_URL: http://course-service:8083
      ENROLLMENT_URL: http://enrollment-service:8084
      LEARNING_URL: http://learning-service:8085
      ASSESSMENT_URL: http://assessment-service:8086
      GRADING_URL: http://grading-service:8087
      REPORTING_URL: http://reporting-service:8088
      FILE_STORAGE_URL: http://file-storage-service:8089
      LICENSE_URL: http://license-service:8090
      AUDIT_URL: http://audit-service:8091
      NOTIFICATION_URL: http://notification-service:8092
      CERTIFICATE_URL: http://certificate-service:8093
      AI_URL: http://ai-service:8094
      CONFIGURATION_URL: http://configuration-service:8095
      INTEGRATION_URL: http://integration-service:8096
      OPERATIONS_URL: http://operations-service:8097
      COMPETENCY_URL: http://competency-service:8098
    # Các service vẫn khởi động song song. Gateway chỉ nhận traffic khi mọi service
    # nghiệp vụ mặc định đã sẵn sàng, tránh 502 và màn hình chờ kéo dài ngay sau startup.
    depends_on:
      identity-service: { condition: service_healthy }
      organization-service: { condition: service_healthy }
      course-service: { condition: service_healthy }
      enrollment-service: { condition: service_healthy }
      learning-service: { condition: service_healthy }
      assessment-service: { condition: service_healthy }
      grading-service: { condition: service_healthy }
      reporting-service: { condition: service_healthy }
      file-storage-service: { condition: service_healthy }
      license-service: { condition: service_healthy }
      audit-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      certificate-service: { condition: service_healthy }
      ai-service: { condition: service_healthy }
      configuration-service: { condition: service_healthy }
      operations-service: { condition: service_healthy }
      competency-service: { condition: service_healthy }

  identity-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["identity-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=identity
      DB_USERNAME: identity_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_DEFAULT_ADMIN_PASSWORD: ${LMSPILOT_DEFAULT_ADMIN_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}
      LICENSE_SERVICE_URL: http://license-service:8090
      ORGANIZATION_SERVICE_URL: http://organization-service:8082
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_USER_DN_PATTERN: ${LDAP_USER_DN_PATTERN:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-(uid={0})}
      LDAP_MANAGER_DN: ${LDAP_MANAGER_DN:-}
      LDAP_MANAGER_PASSWORD: ${LDAP_MANAGER_PASSWORD:-}
      LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:-3000}
      LDAP_READ_TIMEOUT_MS: ${LDAP_READ_TIMEOUT_MS:-5000}

  organization-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["organization-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=organization
      DB_USERNAME: organization_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}

  course-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["course-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=course
      DB_USERNAME: course_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      FILE_STORAGE_SERVICE_URL: http://file-storage-service:8089
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}

  enrollment-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["enrollment-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=enrollment
      DB_USERNAME: enrollment_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      COURSE_SERVICE_URL: http://course-service:8083
      ORGANIZATION_SERVICE_URL: http://organization-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8085
      LEARNING_SERVICE_CONNECT_TIMEOUT_MS: ${LEARNING_SERVICE_CONNECT_TIMEOUT_MS:-3000}
      LEARNING_SERVICE_READ_TIMEOUT_MS: ${LEARNING_SERVICE_READ_TIMEOUT_MS:-5000}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}

  learning-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["learning-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=learning
      DB_USERNAME: learning_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      COURSE_SERVICE_URL: http://course-service:8083
      FILE_STORAGE_SERVICE_URL: http://file-storage-service:8089
      ORGANIZATION_SERVICE_URL: http://organization-service:8082
      LEARNING_ASSIGNMENT_MAX_ATTEMPTS: ${LEARNING_ASSIGNMENT_MAX_ATTEMPTS:-10}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}

  assessment-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["assessment-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=assessment
      DB_USERNAME: assessment_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      COURSE_SERVICE_URL: http://course-service:8083
      ORGANIZATION_SERVICE_URL: http://organization-service:8082
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}

  grading-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["grading-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=grading
      DB_USERNAME: grading_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      SERVICES_ASSESSMENT_URL: http://assessment-service:8086

  reporting-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["reporting-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=reporting
      DB_USERNAME: reporting_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084

  file-storage-service:
    <<: *service-common
    user: "0:0"
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["file-storage-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8089
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=file_storage
      DB_USERNAME: file_storage_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:-/var/lib/lmspilot/files}
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-200MB}
      FILE_MAX_REQUEST_SIZE: ${FILE_MAX_REQUEST_SIZE:-210MB}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-209715200}
      FILE_ALLOWED_TYPES: ${FILE_ALLOWED_TYPES}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}
      FILE_EDITOR_PUBLIC_BASE_URL: ${FILE_EDITOR_PUBLIC_BASE_URL:-http://localhost:8080}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://onlyoffice:80}
      FILE_EDIT_SESSION_MINUTES: ${FILE_EDIT_SESSION_MINUTES:-120}
    volumes:
      - files:/var/lib/lmspilot/files

  license-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["license-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8090
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=license
      DB_USERNAME: license_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_ALLOW_DEVELOPMENT_LICENSE: ${LMSPILOT_ALLOW_DEVELOPMENT_LICENSE:-false}
      LMSPILOT_LICENSE_PUBLIC_KEY: ${LMSPILOT_LICENSE_PUBLIC_KEY:-}
      LMSPILOT_MACHINE_FINGERPRINT: ${LMSPILOT_MACHINE_FINGERPRINT:-development}

  audit-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["audit-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8091
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=audit
      DB_USERNAME: audit_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}

  notification-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["notification-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8092
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=notification
      DB_USERNAME: notification_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-no-reply@lmspilot.local}
      NOTIFICATION_EMAIL_MAX_ATTEMPTS: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:-8}
      NOTIFICATION_EMAIL_INITIAL_BACKOFF: ${NOTIFICATION_EMAIL_INITIAL_BACKOFF:-PT1M}
      NOTIFICATION_EMAIL_MAX_BACKOFF: ${NOTIFICATION_EMAIL_MAX_BACKOFF:-PT6H}
      NOTIFICATION_EMAIL_PROCESSING_LEASE: ${NOTIFICATION_EMAIL_PROCESSING_LEASE:-PT5M}
      NOTIFICATION_REMINDER_WORKER_DELAY_MS: ${NOTIFICATION_REMINDER_WORKER_DELAY_MS:-60000}
      NOTIFICATION_REMINDER_RETRY_DELAY_SECONDS: ${NOTIFICATION_REMINDER_RETRY_DELAY_SECONDS:-300}
      NOTIFICATION_REPORTING_CONNECT_TIMEOUT_MS: ${NOTIFICATION_REPORTING_CONNECT_TIMEOUT_MS:-3000}
      NOTIFICATION_REPORTING_READ_TIMEOUT_MS: ${NOTIFICATION_REPORTING_READ_TIMEOUT_MS:-5000}
      REPORTING_SERVICE_URL: http://reporting-service:8088
      FILE_STORAGE_SERVICE_URL: http://file-storage-service:8089

  certificate-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["certificate-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8093
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=certificate
      DB_USERNAME: certificate_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}

  ai-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["ai-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8094
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=ai
      DB_USERNAME: ai_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      FILE_STORAGE_SERVICE_URL: http://file-storage-service:8089
      COURSE_SERVICE_URL: http://course-service:8083
      ASSESSMENT_SERVICE_URL: http://assessment-service:8086
      AI_SECRET_KEY: ${AI_SECRET_KEY}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_API_KEY: ${AI_API_KEY:-local-only}
      OLLAMA_MANAGEMENT_URL: ${OLLAMA_MANAGEMENT_URL:-http://ollama:11434}
      OLLAMA_OPENAI_BASE_URL: ${OLLAMA_OPENAI_BASE_URL:-http://ollama:11434/v1}

  configuration-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["configuration-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8095
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=configuration
      DB_USERNAME: configuration_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      CONFIGURATION_SECRET_KEY: ${CONFIGURATION_SECRET_KEY}
      FILE_STORAGE_SERVICE_URL: http://file-storage-service:8089

  integration-service:
    <<: *service-common
    profiles: [extended]
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["integration-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8096
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=integration
      DB_USERNAME: integration_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}

  operations-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["operations-service"]
    ports: ["127.0.0.1:8097:8097"]
    environment:
      <<: *service-env
      SERVER_PORT: 8097
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=operations
      DB_USERNAME: operations_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      OPERATIONS_SERVICE_URLS: identity=http://identity-service:8081,course=http://course-service:8083,learning=http://learning-service:8085,assessment=http://assessment-service:8086,competency=http://competency-service:8098


  competency-service:
    <<: *service-common
    image: lmspilot/backend-bundle:0.24.0
    build: *backend-build
    command: ["competency-service"]
    environment:
      <<: *service-env
      SERVER_PORT: 8098
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=competency
      DB_USERNAME: competency_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [lmspilot]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LMSPILOT_GATEWAY_URL: http://api-gateway:8080
      LMSPILOT_COOKIE_SECURE: ${LMSPILOT_COOKIE_SECURE:-false}
      LMSPILOT_SESSION_COOKIE_SECRET: ${LMSPILOT_JWT_SECRET}
      LMSPILOT_UPSTREAM_TIMEOUT_MS: ${LMSPILOT_UPSTREAM_TIMEOUT_MS:-7000}
      LMSPILOT_UPSTREAM_MUTATION_TIMEOUT_MS: ${LMSPILOT_UPSTREAM_MUTATION_TIMEOUT_MS:-12000}
      LMSPILOT_AI_UPSTREAM_TIMEOUT_MS: ${LMSPILOT_AI_UPSTREAM_TIMEOUT_MS:-300000}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-false}
      LMSPILOT_DEFAULT_ADMIN_PASSWORD: ${LMSPILOT_DEFAULT_ADMIN_PASSWORD}
      NEXT_PUBLIC_APP_NAME: LMSPilot
    depends_on:
      api-gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    networks: [lmspilot]
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    restart: unless-stopped
    networks: [lmspilot]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-dev-only}
    volumes:
      - grafana_data:/var/lib/grafana
