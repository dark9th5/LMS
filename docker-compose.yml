name: lmspilot

x-service-common: &service-common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks: [lmspilot]
  environment: &service-env
    SPRING_PROFILES_ACTIVE: docker
    LMSPILOT_JWT_SECRET: ${LMSPILOT_JWT_SECRET}
    LMSPILOT_INTERNAL_TOKEN: ${LMSPILOT_INTERNAL_TOKEN}
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: 5672
    SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
    SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [lmspilot]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lmspilot}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_SERVICE_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-lmspilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    networks: [lmspilot]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks: [lmspilot]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-gateway:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { SERVICE: api-gateway }
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_URL: http://identity-service:8081
      ORGANIZATION_URL: http://organization-service:8082
      COURSE_URL: http://course-service:8083
      ENROLLMENT_URL: http://enrollment-service:8084
      LEARNING_URL: http://learning-service:8085
      ASSESSMENT_URL: http://assessment-service:8086
      GRADING_URL: http://grading-service:8087
      REPORTING_URL: http://reporting-service:8088
      FILE_STORAGE_URL: http://file-storage-service:8089
      LICENSE_URL: http://license-service:8090
      AUDIT_URL: http://audit-service:8091
      NOTIFICATION_URL: http://notification-service:8092
      CERTIFICATE_URL: http://certificate-service:8093
      AI_URL: http://ai-service:8094
      CONFIGURATION_URL: http://configuration-service:8095
      INTEGRATION_URL: http://integration-service:8096
      OPERATIONS_URL: http://operations-service:8097
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy

  identity-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: identity-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=identity
      DB_USERNAME: identity_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_DEFAULT_ADMIN_PASSWORD: ${LMSPILOT_DEFAULT_ADMIN_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}

  organization-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: organization-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=organization
      DB_USERNAME: organization_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}

  course-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: course-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=course
      DB_USERNAME: course_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}

  enrollment-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: enrollment-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=enrollment
      DB_USERNAME: enrollment_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      COURSE_SERVICE_URL: http://course-service:8083
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}

  learning-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: learning-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=learning
      DB_USERNAME: learning_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      COURSE_SERVICE_URL: http://course-service:8083
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}

  assessment-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: assessment-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=assessment
      DB_USERNAME: assessment_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}

  grading-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: grading-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=grading
      DB_USERNAME: grading_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      SERVICES_ASSESSMENT_URL: http://assessment-service:8086

  reporting-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: reporting-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=reporting
      DB_USERNAME: reporting_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084

  file-storage-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: file-storage-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8089
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=file_storage
      DB_USERNAME: file_storage_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:-/var/lib/lmspilot/files}
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-200MB}
      FILE_MAX_REQUEST_SIZE: ${FILE_MAX_REQUEST_SIZE:-210MB}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-209715200}
      FILE_ALLOWED_TYPES: ${FILE_ALLOWED_TYPES}
    volumes:
      - files:/var/lib/lmspilot/files

  license-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: license-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8090
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=license
      DB_USERNAME: license_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_ALLOW_DEVELOPMENT_LICENSE: ${LMSPILOT_ALLOW_DEVELOPMENT_LICENSE:-true}
      LMSPILOT_LICENSE_PUBLIC_KEY: ${LMSPILOT_LICENSE_PUBLIC_KEY:-}
      LMSPILOT_MACHINE_FINGERPRINT: ${LMSPILOT_MACHINE_FINGERPRINT:-development}

  audit-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: audit-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8091
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=audit
      DB_USERNAME: audit_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}

  notification-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: notification-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8092
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=notification
      DB_USERNAME: notification_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-no-reply@lmspilot.local}

  certificate-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: certificate-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8093
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=certificate
      DB_USERNAME: certificate_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}

  ai-service:
    <<: *service-common
    profiles: [extended]
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: ai-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8094
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_API_KEY: ${AI_API_KEY:-local-only}

  configuration-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: configuration-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8095
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=configuration
      DB_USERNAME: configuration_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}

  integration-service:
    <<: *service-common
    profiles: [extended]
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: integration-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8096
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=integration
      DB_USERNAME: integration_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}

  operations-service:
    <<: *service-common
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: operations-service } }
    environment:
      <<: *service-env
      SERVER_PORT: 8097
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmspilot}?currentSchema=operations
      DB_USERNAME: operations_user
      DB_PASSWORD: ${POSTGRES_SERVICE_PASSWORD}
      OPERATIONS_SERVICE_URLS: identity=http://identity-service:8081,course=http://course-service:8083,learning=http://learning-service:8085,assessment=http://assessment-service:8086

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [lmspilot]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LMSPILOT_GATEWAY_URL: http://api-gateway:8080
      LMSPILOT_COOKIE_SECURE: ${LMSPILOT_COOKIE_SECURE:-false}
      LMSPILOT_SEED_DEMO: ${LMSPILOT_SEED_DEMO:-true}
      LMSPILOT_DEFAULT_ADMIN_PASSWORD: ${LMSPILOT_DEFAULT_ADMIN_PASSWORD}
      NEXT_PUBLIC_APP_NAME: LMSPilot
    depends_on:
      api-gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    networks: [lmspilot]
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    restart: unless-stopped
    networks: [lmspilot]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-dev-only}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

networks:
  lmspilot:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  files:
    name: lmspilot_files
  prometheus_data:
  grafana_data:
