server:
  port: ${SERVER_PORT:8092}
  shutdown: graceful
spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmspilot?currentSchema=notification}
    username: ${DB_USERNAME:notification_user}
    password: ${DB_PASSWORD:notification_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          multiplier: 2
          max-interval: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
lmspilot:
  jwt:
    secret: ${LMSPILOT_JWT_SECRET}
  internal-token: ${LMSPILOT_INTERNAL_TOKEN}
identity-service:
  url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
file-storage-service:
  url: ${FILE_STORAGE_SERVICE_URL:http://localhost:8089}
notification:
  reminder-worker-delay-ms: ${NOTIFICATION_REMINDER_WORKER_DELAY_MS:60000}
  reminder-retry-delay-seconds: ${NOTIFICATION_REMINDER_RETRY_DELAY_SECONDS:300}
  reporting-connect-timeout-ms: ${NOTIFICATION_REPORTING_CONNECT_TIMEOUT_MS:3000}
  reporting-read-timeout-ms: ${NOTIFICATION_REPORTING_READ_TIMEOUT_MS:5000}
  email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
  from: ${NOTIFICATION_FROM:no-reply@lmspilot.local}
  email-max-attempts: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:8}
  email-initial-backoff: ${NOTIFICATION_EMAIL_INITIAL_BACKOFF:PT1M}
  email-max-backoff: ${NOTIFICATION_EMAIL_MAX_BACKOFF:PT6H}
  email-processing-lease: ${NOTIFICATION_EMAIL_PROCESSING_LEASE:PT5M}
  email-batch-size: ${NOTIFICATION_EMAIL_BATCH_SIZE:50}
  email-worker-delay-ms: ${NOTIFICATION_EMAIL_WORKER_DELAY_MS:15000}

reporting-service:
  url: ${REPORTING_SERVICE_URL:http://localhost:8088}
