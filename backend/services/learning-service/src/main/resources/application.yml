server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
spring:
  application:
    name: learning-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmspilot?currentSchema=learning}
    username: ${DB_USERNAME:learning_user}
    password: ${DB_PASSWORD:learning_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          multiplier: 2
          max-interval: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
lmspilot:
  jwt:
    secret: ${LMSPILOT_JWT_SECRET}
  internal-token: ${LMSPILOT_INTERNAL_TOKEN}

enrollment-service:
  url: ${ENROLLMENT_SERVICE_URL:http://localhost:8084}
course-service:
  url: ${COURSE_SERVICE_URL:http://localhost:8083}
