server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
spring:
  application:
    name: license-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmspilot?currentSchema=license}
    username: ${DB_USERNAME:license_user}
    password: ${DB_PASSWORD:license_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          multiplier: 2
          max-interval: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
lmspilot:
  jwt:
    secret: ${LMSPILOT_JWT_SECRET}
  internal-token: ${LMSPILOT_INTERNAL_TOKEN}
license:
  public-key: ${LMSPILOT_LICENSE_PUBLIC_KEY:}
  allow-development: ${LMSPILOT_ALLOW_DEVELOPMENT_LICENSE:true}
  machine-fingerprint: ${LMSPILOT_MACHINE_FINGERPRINT:development}
