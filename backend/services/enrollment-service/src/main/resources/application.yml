server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
spring:
  application:
    name: enrollment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmspilot?currentSchema=enrollment}
    username: ${DB_USERNAME:enrollment_user}
    password: ${DB_PASSWORD:enrollment_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          multiplier: 2
          max-interval: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
lmspilot:
  jwt:
    secret: ${LMSPILOT_JWT_SECRET}
  internal-token: ${LMSPILOT_INTERNAL_TOKEN}

course-service:
  url: ${COURSE_SERVICE_URL:http://localhost:8083}

organization-service:
  url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}

learning-service:
  url: ${LEARNING_SERVICE_URL:http://localhost:8085}
  connect-timeout-ms: ${LEARNING_SERVICE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${LEARNING_SERVICE_READ_TIMEOUT_MS:5000}
