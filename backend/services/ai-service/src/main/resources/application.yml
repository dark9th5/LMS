server:
  port: ${SERVER_PORT:8094}
  shutdown: graceful
spring:
  application:
    name: ai-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmspilot?currentSchema=ai}
    username: ${DB_USERNAME:ai_user}
    password: ${DB_PASSWORD:ai_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
lmspilot:
  jwt:
    secret: ${LMSPILOT_JWT_SECRET}
  internal-token: ${LMSPILOT_INTERNAL_TOKEN}
ai:
  enabled: ${AI_ENABLED:false}
  base-url: ${AI_BASE_URL:http://host.docker.internal:11434/v1}
  model: ${AI_MODEL:qwen3:8b}
  api-key: ${AI_API_KEY:local-only}
  secret-key: ${AI_SECRET_KEY}
file-storage-service:
  url: ${FILE_STORAGE_SERVICE_URL:http://localhost:8089}
assessment-service:
  url: ${ASSESSMENT_SERVICE_URL:http://localhost:8086}

course-service:
  url: ${COURSE_SERVICE_URL:http://localhost:8083}
