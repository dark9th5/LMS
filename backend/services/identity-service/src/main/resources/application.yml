server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmspilot?currentSchema=identity}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD:identity_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          multiplier: 2
          max-interval: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
lmspilot:
  jwt:
    secret: ${LMSPILOT_JWT_SECRET}
  internal-token: ${LMSPILOT_INTERNAL_TOKEN}
  seed-demo: ${LMSPILOT_SEED_DEMO:false}
  default-admin-password: ${LMSPILOT_DEFAULT_ADMIN_PASSWORD}

identity:
  access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
  lockout:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    duration: ${LOGIN_LOCKOUT_DURATION:PT15M}
  password-policy:
    min-length: ${PASSWORD_MIN_LENGTH:12}
    require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
    require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
    require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
    require-special: ${PASSWORD_REQUIRE_SPECIAL:true}
    history-count: ${PASSWORD_HISTORY_COUNT:5}
  ldap:
    enabled: ${LDAP_ENABLED:false}
    url: ${LDAP_URL:}
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:}
    base-dn: ${LDAP_BASE_DN:}
    user-search-filter: ${LDAP_USER_SEARCH_FILTER:(uid={0})}
    manager-dn: ${LDAP_MANAGER_DN:}
    manager-password: ${LDAP_MANAGER_PASSWORD:}
    connect-timeout-ms: ${LDAP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${LDAP_READ_TIMEOUT_MS:5000}

license-service:
  url: ${LICENSE_SERVICE_URL:http://localhost:8090}

organization-service:
  url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
