server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lmspilot?currentSchema=identity}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD:identity_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          multiplier: 2
          max-interval: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
lmspilot:
  jwt:
    secret: ${LMSPILOT_JWT_SECRET}
  internal-token: ${LMSPILOT_INTERNAL_TOKEN}
  seed-demo: ${LMSPILOT_SEED_DEMO:false}
  default-admin-password: ${LMSPILOT_DEFAULT_ADMIN_PASSWORD}

identity:
  access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
